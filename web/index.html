<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EBE5D9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a0709" media="(prefers-color-scheme: dark)" />
    <!-- Set the theme class before first paint so a dark-mode reload never flashes beige.
         Mirrors next-themes: the stored choice ("theme"), else the OS preference. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <title>Orabl</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
