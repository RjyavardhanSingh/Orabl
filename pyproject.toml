[project]
name = "self-learning-platform"
version = "0.1.0"
description = "Self Learning Platform - adaptive oral learning context builder"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nishant Raj", email = "nraj02415@gmail.com" }
]
dependencies = [
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "redis[hiredis]>=5.0.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.43.97",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "psycopg2-binary>=2.9.13",
    "httpx>=0.28.0",
    "cryptography>=42.0.0",
]

[project.scripts]
agent = "cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["models", "ingestion", "context", "api", "services", "cache", "db"]
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
